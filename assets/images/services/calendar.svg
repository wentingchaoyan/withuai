<svg width="243" height="221" viewBox="0 0 243 221" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Orange circle border -->
  <circle cx="128" cy="121" r="95" stroke="#FF511B" stroke-width="10" fill="none"/>

  <!-- Calendar base -->
  <rect x="78" y="75" width="100" height="95" rx="5" fill="#FFFFFF" stroke="#FF511B" stroke-width="2"/>

  <!-- Calendar header -->
  <rect x="78" y="75" width="100" height="25" rx="5" fill="#FF511B"/>
  <rect x="78" y="90" width="100" height="10" fill="#FF511B"/>

  <!-- Calendar rings -->
  <rect x="95" y="68" width="6" height="15" rx="2" fill="#FF511B"/>
  <rect x="120" y="68" width="6" height="15" rx="2" fill="#FF511B"/>
  <rect x="145" y="68" width="6" height="15" rx="2" fill="#FF511B"/>

  <!-- Month text placeholder -->
  <line x1="100" y1="87" x2="156" y2="87" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Calendar grid lines -->
  <line x1="78" y1="120" x2="178" y2="120" stroke="#FFE4DC" stroke-width="1"/>
  <line x1="78" y1="145" x2="178" y2="145" stroke="#FFE4DC" stroke-width="1"/>
  <line x1="100" y1="100" x2="100" y2="170" stroke="#FFE4DC" stroke-width="1"/>
  <line x1="128" y1="100" x2="128" y2="170" stroke="#FFE4DC" stroke-width="1"/>
  <line x1="156" y1="100" x2="156" y2="170" stroke="#FFE4DC" stroke-width="1"/>

  <!-- Date numbers -->
  <text x="86" y="115" font-family="Arial, sans-serif" font-size="10" fill="#666666">1</text>
  <text x="112" y="115" font-family="Arial, sans-serif" font-size="10" fill="#666666">2</text>
  <text x="138" y="115" font-family="Arial, sans-serif" font-size="10" fill="#666666">3</text>
  <text x="164" y="115" font-family="Arial, sans-serif" font-size="10" fill="#666666">4</text>
  <text x="86" y="140" font-family="Arial, sans-serif" font-size="10" fill="#666666">5</text>
  <text x="112" y="140" font-family="Arial, sans-serif" font-size="10" fill="#666666">6</text>
  <text x="138" y="140" font-family="Arial, sans-serif" font-size="10" fill="#666666">7</text>
  <text x="164" y="140" font-family="Arial, sans-serif" font-size="10" fill="#666666">8</text>
  <text x="86" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666666">9</text>
  <text x="109" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666666">10</text>
  <text x="136" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666666">11</text>
  <text x="162" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666666">12</text>

  <!-- Highlighted date circle -->
  <circle cx="141" cy="136" r="10" fill="#FFE4DC" stroke="#FF511B" stroke-width="2"/>

  <!-- Checkmark on highlighted date -->
  <path d="M136 136 L139 139 L146 132" stroke="#FF511B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small clock icon -->
  <circle cx="165" cy="75" r="12" fill="#FFFFFF" stroke="#FF511B" stroke-width="2"/>
  <line x1="165" y1="75" x2="165" y2="68" stroke="#FF511B" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="75" x2="171" y2="78" stroke="#FF511B" stroke-width="2" stroke-linecap="round"/>
</svg>
