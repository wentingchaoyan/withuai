<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認証処理 - WithU AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #F4F1F0;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FF511B;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #28a745;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .message {
            color: #666;
            margin-bottom: 30px;
        }
        .app-link {
            background-color: #FF511B;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            margin-top: 20px;
        }
        .download-link {
            background-color: #D7C862;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
        }
        .error-message {
            color: #FF511B;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>認証処理中...</h2>
        <p>適切なページにリダイレクトしています...</p>
    </div>
    
    <script>
        // 認証処理を完結
        function handleAuth() {
            const urlParams = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = urlParams.get('access_token');
            const type = urlParams.get('type');
            const email = urlParams.get('email');
            
            if (accessToken && type) {
                // アプリのディープリンクURLを構築
                let appUrl = 'withu://auth/v1/verify';
                if (accessToken) {
                    appUrl += `?access_token=${accessToken}`;
                }
                if (type) {
                    appUrl += `${accessToken ? '&' : '?'}type=${type}`;
                }
                if (email) {
                    appUrl += `${accessToken || type ? '&' : '?'}email=${encodeURIComponent(email)}`;
                }
                
                // インナーブラウザ検出
                function isInAppBrowser() {
                    const userAgent = navigator.userAgent.toLowerCase();
                    return userAgent.includes('gmail') || 
                           userAgent.includes('google') ||
                           userAgent.includes('outlook') ||
                           userAgent.includes('apple-mail') ||
                           userAgent.includes('mail') ||
                           userAgent.includes('mobile') ||
                           window.location.href.includes('gmail.com') ||
                           window.location.href.includes('outlook.com') ||
                           window.location.href.includes('icloud.com');
                }
                
                // ユニバーサルリンクの処理
                function handleUniversalLink() {
                    // ユニバーサルリンクが自動的にアプリを開くのを待つ
                    setTimeout(() => {
                        // アプリが開かれていない場合のフォールバック
                        if (!document.hidden && !document.webkitHidden) {
                            if (isInAppBrowser()) {
                                // メールアプリ内の場合は、手動でアプリを開くボタンを表示
                                showFallbackButton(appUrl, 'メールアプリ内で開いているため、手動でアプリを開いてください。');
                            } else {
                                // 通常のブラウザの場合は、アプリを開く試行
                                window.location.href = appUrl;
                                
                                setTimeout(() => {
                                    if (!document.hidden && !document.webkitHidden) {
                                        showFallbackButton(appUrl, 'アプリが開けませんでした。手動でアプリを開いてください。');
                                    }
                                }, 2000);
                            }
                        }
                    }, 1000);
                }
                
                // フォールバックボタンを表示
                function showFallbackButton(appUrl, message) {
                    const container = document.querySelector('.container');
                    container.innerHTML = `
                        <div class="success">✅ 認証が完了しました</div>
                        <div class="message">
                            ${type === 'recovery' ? 'パスワードリセット' : 'メールアドレスの確認'}が完了しました。<br>
                            アプリで処理を続行してください。
                        </div>
                        <div class="error-message">${message}</div>
                        <a href="${appUrl}" class="app-link">アプリを開く</a>
                        <a href="https://play.google.com/store/apps/details?id=com.withuai.withu" class="download-link">アプリをダウンロード</a>
                    `;
                }
                
                // 処理開始
                handleUniversalLink();
                
            } else {
                // パラメータが不正な場合
                window.location.href = '/';
            }
        }
        
        // ページ読み込み時に実行
        window.addEventListener('load', handleAuth);
    </script>
</body>
</html>
