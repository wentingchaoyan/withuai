<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>パスワードリセット - WithU AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #F4F1F0;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FF511B;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fallback-link {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #FF511B;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
        }
        .error-message {
            color: #FF511B;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>パスワードリセット</h2>
        <p>アプリでパスワードを変更してください...</p>
        <a href="#" id="fallback-link" class="fallback-link" style="display: none;">
            アプリを開く
        </a>
        <div id="error-message" class="error-message" style="display: none;">
            アプリが開けませんでした。手動でアプリを開いてください。
        </div>
    </div>

    <script>
        // URLパラメータを取得
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const type = urlParams.get('type');
        const email = urlParams.get('email');
        
        // アプリのディープリンクURLを構築
        let appUrl = 'withu://auth/v1/verify';
        if (token) {
            appUrl += `?token=${token}`;
        }
        if (type) {
            appUrl += `${token ? '&' : '?'}type=${type}`;
        }
        if (email) {
            appUrl += `${token || type ? '&' : '?'}email=${encodeURIComponent(email)}`;
        }
        
        // フォールバックリンクを設定
        const fallbackLink = document.getElementById('fallback-link');
        const errorMessage = document.getElementById('error-message');
        fallbackLink.href = appUrl;
        
        // アプリを開く試行
        function openApp() {
            // 直接アプリを開く試行
            window.location.href = appUrl;
            
            // アプリが開かれない場合のフォールバック
            setTimeout(() => {
                if (document.hidden || document.webkitHidden) {
                    // アプリが開かれた場合
                    return;
                }
                
                // アプリが開かれていない場合、フォールバックリンクを表示
                fallbackLink.style.display = 'inline-block';
                errorMessage.style.display = 'block';
            }, 3000);
        }
        
        // ページ読み込み時に即座にアプリを開く
        window.onload = function() {
            // 即座にアプリを開く試行
            setTimeout(openApp, 100);
        };
        
        // フォールバックリンクのクリック処理
        fallbackLink.addEventListener('click', function(e) {
            e.preventDefault();
            openApp();
        });
    </script>
</body>
</html>
