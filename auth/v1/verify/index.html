<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認証確認 - WithU AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f1f0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .success {
            color: #28a745;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .message {
            color: #666;
            margin-bottom: 30px;
        }
        .app-link {
            background-color: #FF511B;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            margin-top: 20px;
        }
        .download-link {
            background-color: #D7C862;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success">✅ 認証が完了しました</div>
        <div class="message">
            メールアドレスの確認が完了しました。<br>
            アプリに戻ってログインしてください。
        </div>
        <div class="loading" id="loading">アプリを起動中...</div>
        <a href="withu://auth/v1/verify" class="app-link" id="appLink" style="display: none;">アプリに戻る</a>
        <a href="https://play.google.com/store/apps/details?id=com.withuai.withu" class="download-link" id="downloadLink" style="display: none;">アプリをダウンロード</a>
    </div>
    
    <script>
        // URLパラメータを取得
        const urlParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = urlParams.get('access_token');
        const type = urlParams.get('type');
        
        // 認証情報をアプリに渡すための処理
        if (accessToken && type === 'signup') {
            // アプリがインストールされている場合は自動的にアプリが起動する
            setTimeout(() => {
                window.location.href = `withu://auth/v1/verify?${window.location.hash.substring(1)}`;
            }, 2000);
            
            // 3秒後にアプリが起動しなかった場合のフォールバック
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('appLink').style.display = 'inline-block';
                document.getElementById('downloadLink').style.display = 'inline-block';
            }, 3000);
        } else {
            // パラメータが不正な場合
            document.getElementById('loading').style.display = 'none';
            document.getElementById('appLink').style.display = 'inline-block';
            document.getElementById('downloadLink').style.display = 'inline-block';
        }
    </script>
</body>
</html>
