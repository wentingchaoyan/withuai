<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF511B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="620" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#000000">
    What We Are Building
  </text>
  <text x="500" y="70" text-anchor="middle" font-size="14" fill="#666666" font-style="italic">
    Lifetime support = Family + Local + Intensive — connected, not isolated
  </text>

  <!-- Top tier: Lifetime Support label -->
  <text x="500" y="110" text-anchor="middle" font-size="13" fill="#FF511B" font-weight="700" letter-spacing="2">
    LIFETIME SUPPORT
  </text>
  <line x1="380" y1="120" x2="620" y2="120" stroke="#FF511B" stroke-width="1.5"/>

  <!-- Family circle (center) — accent color -->
  <circle cx="500" cy="220" r="70" fill="#FF511B" stroke="#000000" stroke-width="2"/>
  <text x="500" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">FAMILY</text>
  <text x="500" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">+ CHILD</text>
  <text x="500" y="252" text-anchor="middle" font-size="11" fill="#FFFFFF" font-style="italic">primary actor</text>

  <!-- Local Layer (left) — dark gray -->
  <rect x="60" y="170" width="280" height="160" rx="10" fill="#333333" stroke="#000000" stroke-width="2"/>
  <text x="200" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">LOCAL LAYER</text>
  <text x="200" y="220" text-anchor="middle" font-size="11" fill="#CCCCCC" font-style="italic">continuity</text>
  <line x1="100" y1="232" x2="300" y2="232" stroke="#666666" stroke-width="0.5"/>
  <text x="200" y="252" text-anchor="middle" font-size="12" fill="#FFFFFF">• weekly therapy</text>
  <text x="200" y="270" text-anchor="middle" font-size="12" fill="#FFFFFF">• school + daily routine</text>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#FFFFFF">• community + peer</text>
  <text x="200" y="306" text-anchor="middle" font-size="12" fill="#FFFFFF">• Hida-type local model</text>

  <!-- Intensive Layer (right) — same gray (peer of Local) -->
  <rect x="660" y="170" width="280" height="160" rx="10" fill="#333333" stroke="#000000" stroke-width="2"/>
  <text x="800" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">INTENSIVE LAYER</text>
  <text x="800" y="220" text-anchor="middle" font-size="11" fill="#CCCCCC" font-style="italic">decisive moments</text>
  <line x1="700" y1="232" x2="900" y2="232" stroke="#666666" stroke-width="0.5"/>
  <text x="800" y="252" text-anchor="middle" font-size="12" fill="#FFFFFF">• 2-3 week courses</text>
  <text x="800" y="270" text-anchor="middle" font-size="12" fill="#FFFFFF">• specialty centers</text>
  <text x="800" y="288" text-anchor="middle" font-size="12" fill="#FFFFFF">• cutting-edge methods</text>
  <text x="800" y="306" text-anchor="middle" font-size="12" fill="#FFFFFF">• NAPA / Cincinnati / Belgium</text>

  <!-- Bidirectional arrows: Family ↔ Local -->
  <line x1="430" y1="210" x2="345" y2="210" stroke="#666666" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="388" y="200" text-anchor="middle" font-size="9" fill="#666666" font-style="italic">daily</text>

  <!-- Bidirectional arrows: Family ↔ Intensive -->
  <line x1="570" y1="210" x2="655" y2="210" stroke="#666666" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="612" y="200" text-anchor="middle" font-size="9" fill="#666666" font-style="italic">episodic</text>

  <!-- Local ↔ Intensive (curved, today: rarely connect) -->
  <path d="M 200 165 Q 500 100 800 165" stroke="#999999" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="500" y="135" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">today: rarely connect</text>

  <!-- Connecting bracket lines down (showing all 3 connect via WithU) -->
  <line x1="200" y1="335" x2="200" y2="395" stroke="#FF511B" stroke-width="2"/>
  <line x1="500" y1="295" x2="500" y2="395" stroke="#FF511B" stroke-width="2"/>
  <line x1="800" y1="335" x2="800" y2="395" stroke="#FF511B" stroke-width="2"/>
  <line x1="200" y1="395" x2="800" y2="395" stroke="#FF511B" stroke-width="2"/>

  <!-- WithU Bridge (bottom bar) — black anchor -->
  <rect x="200" y="425" width="600" height="120" rx="12" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="500" y="460" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">WithU — The Bridge</text>
  <text x="500" y="485" text-anchor="middle" font-size="12" fill="#FF511B" font-style="italic">routing layer that makes the ecosystem operational</text>

  <text x="320" y="520" text-anchor="middle" font-size="11" fill="#FFFFFF">lifetime history</text>
  <text x="500" y="520" text-anchor="middle" font-size="11" fill="#FFFFFF">cross-layer navigation</text>
  <text x="680" y="520" text-anchor="middle" font-size="11" fill="#FFFFFF">outcome feedback loop</text>

  <!-- Footer principle -->
  <text x="500" y="585" text-anchor="middle" font-size="12" fill="#666666" font-style="italic">
    Family is primary. Local is co-pilot. Intensive is map-maker. Knowledge flows in both directions.
  </text>
  <text x="500" y="605" text-anchor="middle" font-size="11" fill="#999999">
    No layer alone delivers lifetime support. The work is to connect them.
  </text>
</svg>
