<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="1000" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#000000">
    WithU Petal Diagram — Comparable Services (v1)
  </text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#666666" font-style="italic">
    No service does all 4 simultaneously — DS core (Phase 1) + rare genetic (Phase 2)
  </text>

  <!-- Connecting subtle lines from center to each petal -->
  <g stroke="#CCCCCC" stroke-width="1" stroke-dasharray="2,3" fill="none">
    <line x1="500" y1="380" x2="500" y2="130"/>
    <line x1="500" y1="380" x2="647" y2="178"/>
    <line x1="500" y1="380" x2="738" y2="303"/>
    <line x1="500" y1="380" x2="738" y2="457"/>
    <line x1="500" y1="380" x2="647" y2="582"/>
    <line x1="500" y1="380" x2="500" y2="630"/>
    <line x1="500" y1="380" x2="353" y2="582"/>
    <line x1="500" y1="380" x2="262" y2="457"/>
    <line x1="500" y1="380" x2="262" y2="303"/>
    <line x1="500" y1="380" x2="353" y2="178"/>
  </g>

  <!-- ============== DIRECT (5) — ORANGE accent ============== -->
  <!-- 1: DS Connect (top) -->
  <rect x="435" y="95" width="130" height="70" rx="10" fill="#FF511B" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">DS Connect</text>
  <text x="500" y="138" text-anchor="middle" font-size="10" fill="#FFFFFF">NIH registry</text>
  <text x="500" y="153" text-anchor="middle" font-size="10" fill="#FFFFFF" font-style="italic">no daily use</text>

  <!-- 2: GiGi's Playhouse -->
  <rect x="582" y="143" width="130" height="70" rx="10" fill="#FF511B" stroke="#000000" stroke-width="1.5"/>
  <text x="647" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">GiGi's Playhouse</text>
  <text x="647" y="186" text-anchor="middle" font-size="10" fill="#FFFFFF">56 US hubs</text>
  <text x="647" y="201" text-anchor="middle" font-size="10" fill="#FFFFFF" font-style="italic">physical-first, US</text>

  <!-- 3: DSDN -->
  <rect x="673" y="268" width="130" height="70" rx="10" fill="#FF511B" stroke="#000000" stroke-width="1.5"/>
  <text x="738" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">DSDN</text>
  <text x="738" y="311" text-anchor="middle" font-size="10" fill="#FFFFFF">new parent peer</text>
  <text x="738" y="326" text-anchor="middle" font-size="10" fill="#FFFFFF" font-style="italic">0–3y only</text>

  <!-- 4: Citizen Platform -->
  <rect x="673" y="422" width="130" height="70" rx="10" fill="#FF511B" stroke="#000000" stroke-width="1.5"/>
  <text x="738" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Citizen Platform</text>
  <text x="738" y="465" text-anchor="middle" font-size="10" fill="#FFFFFF">rare disease data</text>
  <text x="738" y="480" text-anchor="middle" font-size="10" fill="#FFFFFF" font-style="italic">no DS, no bridge</text>

  <!-- 5: Share4Rare -->
  <rect x="582" y="547" width="130" height="70" rx="10" fill="#FF511B" stroke="#000000" stroke-width="1.5"/>
  <text x="647" y="572" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Share4Rare</text>
  <text x="647" y="590" text-anchor="middle" font-size="10" fill="#FFFFFF">EU rare community</text>
  <text x="647" y="605" text-anchor="middle" font-size="10" fill="#FFFFFF" font-style="italic">no DS scope</text>

  <!-- ============== ADJACENT (2) — DARK GRAY ============== -->
  <!-- 6: Joon (bottom) -->
  <rect x="435" y="595" width="130" height="70" rx="10" fill="#333333" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Joon</text>
  <text x="500" y="638" text-anchor="middle" font-size="10" fill="#CCCCCC">ADHD / autism app</text>
  <text x="500" y="653" text-anchor="middle" font-size="10" fill="#FFFFFF" font-style="italic">NOT Phase 1</text>

  <!-- 7: Cognoa -->
  <rect x="288" y="547" width="130" height="70" rx="10" fill="#333333" stroke="#000000" stroke-width="1.5"/>
  <text x="353" y="572" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Cognoa</text>
  <text x="353" y="590" text-anchor="middle" font-size="10" fill="#CCCCCC">FDA autism screen</text>
  <text x="353" y="605" text-anchor="middle" font-size="10" fill="#FFFFFF" font-style="italic">single moment</text>

  <!-- ============== DIFFERENT (3) — LIGHT GRAY with black text ============== -->
  <!-- 8: Brightwheel -->
  <rect x="197" y="422" width="130" height="70" rx="10" fill="#E5E5E5" stroke="#999999" stroke-width="1.5"/>
  <text x="262" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">Brightwheel</text>
  <text x="262" y="465" text-anchor="middle" font-size="10" fill="#666666">preschool app</text>
  <text x="262" y="480" text-anchor="middle" font-size="10" fill="#000000" font-style="italic">not disability</text>

  <!-- 9: Mayo Clinic Int'l -->
  <rect x="197" y="268" width="130" height="70" rx="10" fill="#E5E5E5" stroke="#999999" stroke-width="1.5"/>
  <text x="262" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">Mayo Int'l</text>
  <text x="262" y="311" text-anchor="middle" font-size="10" fill="#666666">medical tourism</text>
  <text x="262" y="326" text-anchor="middle" font-size="10" fill="#000000" font-style="italic">transactional</text>

  <!-- 10: EHR Vendors -->
  <rect x="288" y="143" width="130" height="70" rx="10" fill="#E5E5E5" stroke="#999999" stroke-width="1.5"/>
  <text x="353" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">EHR Vendors</text>
  <text x="353" y="186" text-anchor="middle" font-size="10" fill="#666666">Epic / Cerner</text>
  <text x="353" y="201" text-anchor="middle" font-size="10" fill="#000000" font-style="italic">hospital-centric</text>

  <!-- ============== CENTER: WithU ============== -->
  <circle cx="500" cy="380" r="130" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="500" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">WithU</text>
  <line x1="430" y1="335" x2="570" y2="335" stroke="#FF511B" stroke-width="1.5"/>
  <text x="500" y="358" text-anchor="middle" font-size="10" fill="#FF511B" font-style="italic">No service does all 4:</text>
  <text x="500" y="378" text-anchor="middle" font-size="10" fill="#FFFFFF">① DS core + cross-genetic</text>
  <text x="500" y="394" text-anchor="middle" font-size="10" fill="#FFFFFF">② Cross-stakeholder lifetime</text>
  <text x="500" y="410" text-anchor="middle" font-size="10" fill="#FFFFFF">③ Local + intensive bridge</text>
  <text x="500" y="426" text-anchor="middle" font-size="10" fill="#FFFFFF">④ Parent-built, B2B2C model</text>

  <!-- Legend -->
  <g transform="translate(60, 690)">
    <rect x="0" y="-10" width="14" height="14" fill="#FF511B"/>
    <text x="22" y="1" font-size="11" fill="#000000">Direct comparables (5)</text>
    <rect x="220" y="-10" width="14" height="14" fill="#333333"/>
    <text x="242" y="1" font-size="11" fill="#000000">Adjacent (2) — NOT Phase 1</text>
    <rect x="490" y="-10" width="14" height="14" fill="#E5E5E5" stroke="#999999"/>
    <text x="512" y="1" font-size="11" fill="#000000">Different ecosystem (3) — context only</text>
  </g>
</svg>
